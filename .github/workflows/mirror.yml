# مزامنة تلقائية في الاتجاهين بين:
#   MoTechSys/qahwajeen   (الإنتاج — Vercel ينشر main إلى qahwajeen.com)
#   moain2026/qahwajeen   (نسخة مطابقة للتطوير)
# نفس الملف في المستودعين. كل دفع/حذف لفرع أو وسم في أحدهما يُنسخ إلى الآخر.
#
# الأمان:
#  - لا حلقة: إن كان الطرف الآخر على نفس الكوميت يتوقف فورًا.
#  - لا كتابة فوق عمل الآخر: الدفع fast-forward فقط. إن تغيّر الطرفان معًا
#    يفشل العمل برسالة «diverged» ولا يُمسح شيء (الحل في HANDOFF.md §2).
#  - الدفع القسري (force) يُنسخ قسرًا فقط إن لم يتغيّر الطرف الآخر منذ آخر مزامنة.
# السر المطلوب في كل مستودع: MIRROR_TOKEN = رمز له push على المستودع الآخر
#   (في moain2026/qahwajeen: رمز MoTechSys · في MoTechSys/qahwajeen: رمز moain2026)
name: mirror

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:

concurrency:
  group: mirror-${{ github.event.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mirror ref to the twin repository
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
          SRC_TOKEN: ${{ github.token }}
          SRC: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          DEL_TYPE: ${{ github.event.ref_type }}
          DEL_NAME: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          case "$SRC" in
            MoTechSys/qahwajeen) TARGET=moain2026/qahwajeen ;;
            moain2026/qahwajeen) TARGET=MoTechSys/qahwajeen ;;
            *) echo "::notice::not a mirrored repo ($SRC)"; exit 0 ;;
          esac
          [ -n "${TOKEN:-}" ] || { echo "::error::secret MIRROR_TOKEN is missing in $SRC"; exit 1; }
          DST="https://x-access-token:${TOKEN}@github.com/${TARGET}.git"
          ORIGIN="https://x-access-token:${SRC_TOKEN}@github.com/${SRC}.git"
          git init -q m && cd m
          git config user.name mirror-bot && git config user.email mirror@invalid

          if [ "$EVENT" = delete ]; then
            [ "$DEL_TYPE" = tag ] && REF="refs/tags/$DEL_NAME" || REF="refs/heads/$DEL_NAME"
            if [ -z "$(git ls-remote "$DST" "$REF")" ]; then echo "already absent: $REF"; exit 0; fi
            git push "$DST" ":$REF"
            echo "deleted $REF in $TARGET"; exit 0
          fi

          REF="$PUSH_REF"
          NEW=$(git ls-remote "$ORIGIN" "$REF" | awk '{print $1}' | head -1)
          [ -n "$NEW" ] || { echo "ref $REF no longer exists in $SRC"; exit 0; }
          OLD=$(git ls-remote "$DST" "$REF" | awk '{print $1}' | head -1)
          if [ "$NEW" = "$OLD" ]; then echo "in sync: $REF @ ${NEW:0:7}"; exit 0; fi

          git fetch -q "$ORIGIN" "+$REF:refs/mirror/src"
          SHA=$(git rev-parse refs/mirror/src^{commit} 2>/dev/null || git rev-parse refs/mirror/src)

          # production is deployed by Vercel only for commits it accepts — warn early
          if [ "$TARGET" = MoTechSys/qahwajeen ] && [ "$REF" = refs/heads/main ]; then
            RANGE="$SHA"; [ -n "$OLD" ] && git fetch -q "$DST" "$REF:refs/mirror/dst" && RANGE="refs/mirror/dst..$SHA"
            BAD=$(git log --format='%h %ae' $RANGE | grep -v '256226456+MoTechSys@users.noreply.github.com' || true)
            [ -z "$BAD" ] || echo "::warning::commits not authored by MoTechSys reach production main (Vercel may skip the deploy): $BAD"
          fi

          if [ -n "$OLD" ] && [ "$FORCED" = true ] && [ "$OLD" = "$BEFORE" ]; then
            git push --force-with-lease="$REF:$OLD" "$DST" "refs/mirror/src:$REF"
          elif ! git push "$DST" "refs/mirror/src:$REF"; then
            echo "::error::DIVERGED on $REF — both repositories changed. Nothing was overwritten. Merge one into the other (HANDOFF.md §2) and push again."
            exit 1
          fi
          echo "mirrored $REF ${OLD:0:7} → ${NEW:0:7}  ($SRC → $TARGET)"
