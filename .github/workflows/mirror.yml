# نموذج «الأصل والنسخة»:
#   MoTechSys/qahwajeen  = الأصل (الإنتاج — Vercel ينشر main إلى qahwajeen.com)
#   moain2026/qahwajeen  = نسخة المطوّر (مثل fork)
#
# الأصل ← النسخة : كل شيء (main وكل الفروع والوسوم والحذف) — النسخة تتبع الأصل دائمًا.
# النسخة ← الأصل : فروع العمل فقط (ليس main) — حتى تفتح منها طلب دمج (PR) في الأصل.
#                   main في الأصل لا يتغيّر إلا بدمج طلب. أي دفع مباشر لـ main في النسخة
#                   لا يُنقل، ويُعاد main النسخة إلى main الأصل.
#
# نفس الملف في المستودعين. الربط بـ «مفتاح نشر» (Deploy Key) رسمي من GitHub، خاص بالمستودع:
#   السر MIRROR_KEY = مفتاح SSH خاص، ومفتاحه العام مضاف كـ Deploy Key (كتابة) في المستودع الآخر.
#   لا يعتمد على أي رمز شخصي (توكن) — حذف التوكنات لا يؤثر.
name: mirror

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:

concurrency:
  group: mirror-${{ github.event.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # reset a direct push to main in the copy · add the MoTechSys publish commit

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mirror
        env:
          KEY: ${{ secrets.MIRROR_KEY }}
          SRC_TOKEN: ${{ github.token }}
          SRC: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          DEL_TYPE: ${{ github.event.ref_type }}
          DEL_NAME: ${{ github.event.ref }}
          MOTECH_EMAIL: 256226456+MoTechSys@users.noreply.github.com
        run: |
          set -euo pipefail
          UPSTREAM=MoTechSys/qahwajeen
          COPY=moain2026/qahwajeen
          case "$SRC" in
            "$UPSTREAM") TARGET=$COPY;     ROLE=upstream ;;
            "$COPY")     TARGET=$UPSTREAM; ROLE=copy ;;
            *) echo "::notice::not a mirrored repo ($SRC)"; exit 0 ;;
          esac
          [ -n "${KEY:-}" ] || { echo "::error::secret MIRROR_KEY is missing in $SRC"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror && chmod 600 ~/.ssh/mirror
          ssh-keyscan -t ed25519 github.com 2>/dev/null > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          DST="git@github.com:${TARGET}.git"
          ORIGIN="https://x-access-token:${SRC_TOKEN}@github.com/${SRC}.git"
          git init -q m && cd m

          if [ "$EVENT" = delete ]; then
            [ "$DEL_TYPE" = tag ] && REF="refs/tags/$DEL_NAME" || REF="refs/heads/$DEL_NAME"
          else
            REF="$PUSH_REF"
          fi

          # ── the copy never writes main or tags in the original
          if [ "$ROLE" = copy ] && { [ "$REF" = refs/heads/main ] || [ "${REF#refs/tags/}" != "$REF" ]; }; then
            if [ "$REF" = refs/heads/main ] && [ "$EVENT" = push ]; then
              UP=$(git ls-remote "$DST" refs/heads/main | awk '{print $1}')
              NOW=$(git ls-remote "$ORIGIN" refs/heads/main | awk '{print $1}')
              if [ -n "$UP" ] && [ "$UP" != "$NOW" ]; then
                echo "::warning::Direct push to main in $COPY is not sent to $UPSTREAM. Open a pull request in $UPSTREAM instead. Resetting $COPY main to $UPSTREAM main (${UP:0:7}); your commit stays reachable at refs/heads/rescued/main-${NOW:0:7}."
                git fetch -q "$ORIGIN" "refs/heads/main:refs/r/now"
                git fetch -q "$DST" "refs/heads/main:refs/r/up"
                git push -q "$ORIGIN" "refs/r/now:refs/heads/rescued/main-${NOW:0:7}" || true
                git push -f "$ORIGIN" "refs/r/up:refs/heads/main"
              fi
            fi
            echo "copy → original: $REF is not mirrored (pull requests only)"; exit 0
          fi

          if [ "$EVENT" = delete ]; then
            if [ -z "$(git ls-remote "$DST" "$REF")" ]; then echo "already absent: $REF"; exit 0; fi
            git push "$DST" ":$REF"; echo "deleted $REF in $TARGET"; exit 0
          fi

          NEW=$(git ls-remote "$ORIGIN" "$REF" | awk '{print $1}' | head -1)
          [ -n "$NEW" ] || { echo "ref $REF no longer exists in $SRC"; exit 0; }
          OLD=$(git ls-remote "$DST" "$REF" | awk '{print $1}' | head -1)
          if [ "$NEW" = "$OLD" ]; then echo "in sync: $REF @ ${NEW:0:7}"; exit 0; fi
          git fetch -q "$ORIGIN" "+$REF:refs/mirror/src"

          if [ "$ROLE" = upstream ] && [ "$REF" = refs/heads/main ]; then
            # Vercel deploys only commits authored by a member of its team (MoTechSys).
            # A PR squash-merged by GitHub carries the PR author (e.g. moain2026) → "Account is blocked".
            # Fix: add an empty publish commit authored by MoTechSys on top (same files, no change).
            AUTHOR=$(git log -1 --format=%ae refs/mirror/src)
            if [ "$AUTHOR" != "$MOTECH_EMAIL" ]; then
              git checkout -q --detach refs/mirror/src
              GIT_AUTHOR_NAME=MoTechSys GIT_AUTHOR_EMAIL="$MOTECH_EMAIL" \
              GIT_COMMITTER_NAME=MoTechSys GIT_COMMITTER_EMAIL="$MOTECH_EMAIL" \
                git commit -q --allow-empty -m "chore(deploy): publish ${NEW:0:7}" -m "Authored by MoTechSys so Vercel deploys it. No file change."
              # pushed with the repo's own token → does not re-trigger this workflow (no loop)
              git push "$ORIGIN" "HEAD:$REF"
              git update-ref refs/mirror/src HEAD
              echo "published ${NEW:0:7} as $(git rev-parse --short HEAD) (author MoTechSys)"
            fi
            # the original is the truth for main: the copy always follows it
            git push -f "$DST" "refs/mirror/src:$REF"
          elif [ -n "$OLD" ] && [ "$FORCED" = true ] && [ "$OLD" = "$BEFORE" ]; then
            git push --force-with-lease="$REF:$OLD" "$DST" "refs/mirror/src:$REF"
          elif ! git push "$DST" "refs/mirror/src:$REF"; then
            echo "::error::DIVERGED on $REF — the branch changed in both repositories. Nothing was overwritten. Rebase on the other copy and push again (HANDOFF.md §2)."
            exit 1
          fi
          echo "mirrored $REF ${OLD:0:7} → ${NEW:0:7}  ($SRC → $TARGET)"
